<script type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","headline":"Top Data Centres in Australia: 2026 Directory and Market Overview","description":"This list of data centres in Australia covers 62 government-approved sites, 21 HCF Certified Strategic facilities and 41 enclaves run by 14 providers. It profiles the operators by city, with links to every site in our full directory.","articleBody":"Australia's Data Centre Market in 2026 Australia now ranks fifth globally and second in the Asia Pacific region for data centre capacity, behind only the United States, China, the United Kingdom and Germany (see our full directory of data centre companies in Australia ).​ Mandala Partners' report Data Centres as Enabling Infrastructure forecasts that Australia's deployable data centre capacity will more than double from 1,350MW in 2024 to 3,100MW by 2030, requiring more than AUD $26 billion in new infrastructure investment. CBRE's August 2025 research, AI Adoption Drives Australia's Data Centre Investment and Demand , projects live capacity will grow from approximately 1.4GW in 2025 to around 1.8GW by 2028, while estimated demand will outpace supply by 0.7 to 1.7GW in the same period. CBRE estimates the total investable universe of the Australian data centre sector will reach approximately AUD $46 billion by 2028. The primary demand driver is the structural shift toward AI workloads, reflected across hyperscaler commitments, sovereign cloud programmes and enterprise AI adoption nationally. This shift is visible at the facility level: NEXTDC and OpenAI have signed a memorandum of understanding to jointly develop a 612MW hyperscale AI campus and GPU supercluster at NEXTDC's S7 site in Eastern Creek, Sydney, valued at AUD $7 billion, with OpenAI as the initial anchor tenant under its OpenAI for Countries program. It is one of several large-scale AI infrastructure commitments now in motion across the country, alongside CDC's 504MW Marsden Park campus and NEXTDC's AUD $2 billion M4 Melbourne development approval What Is an HCF-Certified Data Centre? The Australian Government's Hosting Certification Framework (HCF), administered by the Digital Transformation Agency (DTA), certifies data centres at two levels: Certified Strategic and Certified Assured. Certified Strategic is the highest designation, required for sensitive and PROTECTED government workloads under the Whole-of-Government Hosting Strategy. There are currently 62 Certified Strategic Facilities and Enclaves across Australia operated by 14 providers. These are the facilities tracked and indexed by CertifiedStrategic.com .​ Top Data Centre Companies and Operators in Australia NEXTDC NEXTDC is Australia's most geographically distributed certified data centre operator, with 13 HCF-certified Strategic sites across Sydney (S1, S2, S3), Melbourne (M1, M2, M3), Canberra (C1), Brisbane (B1, B2), Perth (P1, P2), Adelaide (A1) and Darwin (D1). It is the only operator with a certified presence in every mainland capital city plus Darwin. S3 in Sydney, M2 and M3 in Melbourne are all 20 to 100MW enclaves. D1 is the only HCF-certified facility in Darwin.​​ In January 2026, NEXTDC received Victorian Government development approval for its M4 campus at Fishermans Bend in Port Melbourne: a 162MW, AUD $2 billion facility designed for AI, defence and sovereign technology workloads, with rack densities exceeding 1,000kW and direct-to-chip liquid cooling. NEXTDC is ASX-listed (NXT) and is a confirmed anchor customer on the SUBCO SMAP hypercable system. CDC Data Centres CDC Data Centres operates 12 HCF-certified sites, the largest portfolio by site count in Australia. Seven sites are in Canberra across the Fyshwick (F1, F2) and Hume (H1 to H5) precincts, four in Sydney at Eastern Creek (EC1 to EC4) and one in Melbourne at Brooklyn.​ CDC began work on a 504MW campus at Marsden Park in Sydney's north-west in October 2024 and won NSW planning approval in November 2025. It will be the largest data centre campus in the Southern Hemisphere when complete. In Melbourne, CDC commenced construction of a 150MW Laverton campus in early 2025, a AUD $2.7 billion investment. CDC is a confirmed SMAP anchor operator. Equinix Equinix holds 10 HCF-Certified Strategic Enclaves and one Strategic Facility across Sydney (SY3 to SY7), Melbourne (ME1, ME2, ME4), Canberra (CA1) and Perth (PE2, PE3). Its certified Sydney and Melbourne enclaves sit adjacent to its International Business Exchange facilities, which host cloud on-ramps for AWS, Azure and Google Cloud in Australia. Equinix is a confirmed SMAP anchor operator, with Perth and Sydney certified sites on the new east-west connectivity spine from March 2026.​ AirTrunk AirTrunk operates three HCF-certified Strategic Facilities: SYD1 at Huntingwood, SYD2 at Lane Cove and MEL1 at Derrimut, all in the 20 to 100MW band. Its facilities are purpose-built for hyperscale and AI workloads. AirTrunk is a confirmed SMAP anchor operator and is majority-owned by Blackstone.​ Macquarie Technology Group Macquarie Technology Group operates six HCF-Certified Strategic sites: Strategic Enclaves IC1, IC2, IC3 and IC3e in Sydney, and Strategic Facilities IC4 and IC5 at Fairbairn in Canberra. Its IC3 Super West facility at Macquarie Park is a purpose-built AI-ready certified data centre with direct-to-chip liquid cooling. Macquarie operates both a certified physical facility and an HCF-certified Sovereign Cloud service, making it the only vertically integrated certified sovereign stack in Australia. ASX-listed (MAQ).​ Digital Realty Digital Realty operates four HCF-Certified Strategic Enclaves: SYD10, SYD11 and SYD14 at Erskine Park in Western Sydney, and MEL11 at Deer Park in Melbourne, all in the 20 to 100MW band. Its sites operate as neutral carrier and hyperscale colocation hubs with global PlatformDIGITAL connectivity. NYSE-listed (DLR).​ DCI Data Centers DCI Data Centers operates a single HCF-certified Strategic Enclave: SYD-01 at Eastern Creek in Western Sydney, in the 20 to 100MW band. It is one of the largest single certified sites in Australia by power band and is positioned in the primary Western Sydney data centre corridor.​ Telstra Telstra holds two HCF-certified sites: the Deakin Strategic Enclave in Canberra (2.5 to 20MW) and the St Leonards Strategic Enclave in Sydney (below 5MW). ASX-listed (TLS).​ Australian Data Centres, Springfield City Group, Fujitsu Australia, DigiCo, Cloud Carrier, Vocus The remaining certified operators each hold between one and three certified sites. Australian Data Centres holds two Canberra sites, ADC Fyshwick and ADC Mitchell, and Vocus holds one, an enclave at TransACT House in Dickson. Springfield City Group (Polaris, Brisbane) and DigiCo (BNE2, Brisbane) are the certified operators in Queensland outside NEXTDC. DigiCo (ASX: DGT) also holds enclaves in Sydney (SYD1) and Adelaide (ADL1). Fujitsu Australia holds two Sydney enclaves, and Cloud Carrier holds one NSW certified site (DB1, Moss Vale).​ For how these operators rank by scale, certification and momentum, see our 2026 ranking of Australia's top data centre operators . List of Data Centres in Australia Certified Strategic Data Centres by Location Location Certified Sites Key Operators Sydney 25 Equinix, Macquarie, CDC, NEXTDC, Digital Realty, Fujitsu, AirTrunk, DCI, Telstra, DigiCo Canberra 15 CDC, Macquarie Technology, Australian Data Centres, Equinix, NEXTDC, Telstra, Vocus Melbourne 9 NEXTDC, Equinix, AirTrunk, Digital Realty, CDC Brisbane 4 NEXTDC, Springfield City Group, DigiCo Perth 4 NEXTDC, Equinix Adelaide 2 NEXTDC, DigiCo Darwin 1 NEXTDC Moss Vale 1 Cloud Carrier Wollongong 1 Equinix Total 62 ​Browse the full, searchable directory of data centres in Australia for every site by provider, city and certification level. Major Developments: 2025 to 2026 NEXTDC M4, Melbourne. Development approval received January 2026. 162MW campus at Fishermans Bend, AUD $2 billion, AI-ready with liquid cooling. CDC Marsden Park, Sydney. NSW planning approval November 2025, groundbreaking October 2024. 504MW, six buildings, largest data centre campus in the Southern Hemisphere when complete. CDC Laverton, Melbourne. Construction commenced early 2025. 150MW, AUD $2.7 billion.​ NEXTDC S7 and OpenAI AI Campus, Sydney. 612MW hyperscale AI campus and GPU supercluster under development at Eastern Creek via NEXTDC and OpenAI MOU. AUD $7 billion. OpenAI is the initial anchor tenant under its OpenAI for Countries program; first-phase delivery is expected in the second half of 2027. SUBCO SMAP Hypercable . First services on the Perth-Adelaide-Melbourne segment delivered March 2026. Full system commissioning May 2026. 400Tb-plus capacity across 16 fibre pairs. NEXTDC, CDC, Equinix and AirTrunk are confirmed anchor data centre operators. Anthropic, at least 1.4GW. Anthropic went to tender for at least 1.4GW of Australian capacity. The Australian Financial Review reported its first lease on 16 September 2026, at the campus Zerra DC is planning at Kogan in Queensland's Western Downs, and on 22 September reported that it is in advanced talks to anchor AirTrunk's 540MW campus at Kurri Kurri in the Hunter. Neoclouds: Sharon AI, Firmus and IREN. GPU-first cloud operators building AI capacity in Australia alongside the colocation providers above. See the Sharon AI , Firmus and IREN profiles, and how neoclouds differ from hyperscalers . Key Research and Reports The following reports provide the primary market data underpinning Australia's data centre capacity and demand forecasts: Mandala Partners, Data Centres as Enabling Infrastructure (2025): commissioned by Australia's five largest data centre operators, forecasting 3,100MW by 2030 and AUD $26 billion in required investment. Mandala Partners, Empowering Australia's Digital Future (2024): foundational analysis of data centres as enabling infrastructure for the digital economy.​ CBRE, AI Adoption Drives Australia's Data Centre Investment and Demand (August 2025): capacity growth projections, supply-demand gap modelling and investable universe estimate to 2028.​ CBRE, Why Australia for Data Centres (2025): strategic positioning of Australia as a data centre destination in the Asia Pacific context.","image":"https://cqkahwrchxtcoiexmlxf.supabase.co/storage/v1/object/public/article-images/top-data-centres-in-australia-2026-directory-and-market-overview-1786713289426.jpg","datePublished":"2026-03-04T05:43:05.549+00:00","dateModified":"2026-10-02T13:18:35.513558+00:00","author":{"@type":"Person","name":"Winston Su","jobTitle":"Editor","url":"https://www.linkedin.com/in/winstonsu/"},"publisher":{"@type":"Organization","name":"Certified Strategic","url":"https://certifiedstrategic.com","logo":{"@type":"ImageObject","url":"https://certifiedstrategic.com/lovable-uploads/426f8998-dca9-408b-9ae8-78813c8da1d9.png"}},"mainEntityOfPage":{"@type":"WebPage","@id":"https://certifiedstrategic.com/insights/top-data-centres-in-australia-2026-directory-and-market-overview"},"articleSection":"Market Intelligence"}</script>
