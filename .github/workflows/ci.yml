name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Deliberately built with no Supabase credentials. Every page that reads
      # data is dynamic, so the build never touches the database, and a build
      # that only succeeds with credentials present would be hiding that.
      - name: Build
        run: npm run build
